# LinkPulse local development stack.
# LP-3a: Postgres only. LP-3b will add `backend` and `frontend` services.
#
# Compose reads the sibling .env file for ${VAR} substitution below.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down   (add -v to also wipe the data volume)

services:
  db:
    image: postgres:16
    container_name: linkpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — publishes Postgres to localhost:5432 so the
      # host-run backend and Alembic (LP-2) can connect.
      - "5432:5432"
    volumes:
      # Named volume persists data across `down`/`up`. Survives until
      # explicitly removed with `docker compose down -v`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready reports true only once Postgres accepts connections,
      # not merely when the container has started. LP-3b's backend will
      # wait on this via `depends_on: condition: service_healthy`.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: linkpulse-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name `db`,
      # NOT localhost. This overrides the .env DATABASE_URL (which targets
      # localhost, for host-run dev). Reuses the same POSTGRES_* credentials.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount source for hot-reload; the anonymous volume masks the host's
      # macOS .venv so it cannot shadow the image's Linux-installed deps.
      - ./backend:/app
      - /app/.venv
    # Apply migrations once the DB is healthy, then start the reloading server.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: linkpulse-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Inside the compose network the backend is reachable as `backend`, not
      # localhost. Vite's dev proxy reads this to forward /api correctly.
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      # Same pattern: mount source, mask host node_modules (macOS binaries)
      # with a container-managed volume.
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  pgdata:
