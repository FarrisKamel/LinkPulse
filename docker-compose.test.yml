# Full stack for E2E tests (LP-14), deterministic and offline:
#   FAKE_METADATA=1 -> the backend uses the stub fetcher (no live network)
#   TESTING=1       -> exposes POST /api/_test/reset for per-test DB cleanup
#
# Bring it up with:  docker compose -f docker-compose.test.yml up -d --build
# then poll localhost:8000/api/health and localhost:5173 before running tests.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: linkpulse
      POSTGRES_DB: linkpulse_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkpulse -d linkpulse_e2e"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://linkpulse:linkpulse@db:5432/linkpulse_e2e
      FAKE_METADATA: "1"
      TESTING: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host
