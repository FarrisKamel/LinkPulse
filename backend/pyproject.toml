[project]
name = "linkpulse-backend"
version = "0.1.0"
description = "LinkPulse backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

# Installed only with `pip install -e ".[dev]"` — the CI and local dev extra.
# Kept out of runtime deps so production images stay lean.
[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    # httpx is now a runtime dependency (the app fetches with it); tests reuse it.
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --- Tooling config, centralized here so CLI and CI read the same rules ---

[tool.ruff]
line-length = 88
target-version = "py312"
# Alembic writes these files from its own template — long DDL strings and a
# fixed header format. We lint our own code (incl. alembic/env.py), not the
# generated migrations.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = import sorting, UP = pyupgrade, B = bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the backend root on sys.path so `import app` resolves during collection
# regardless of how pytest rewrites sys.path[0].
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's async engine executes inside greenlets; without this, coverage
# loses the trace on every `await session.…` and reports endpoint bodies as
# uncovered even though they ran.
concurrency = ["greenlet", "thread"]
